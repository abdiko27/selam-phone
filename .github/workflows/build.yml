name: Build branded phone app

# Runs on GitHub's free Windows machines, so you don't need Visual Studio on your PC.
# Start it from the Actions tab (Run workflow), or push a tag like v1.0.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      BUILD_ROOT: ${{ github.workspace }}\..\microsip-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get the upstream source at the pinned commit
        shell: pwsh
        run: |
          $u = Get-Content upstream.json -Raw | ConvertFrom-Json
          git init upstream
          git -C upstream remote add origin $u.repo
          git -C upstream fetch --depth 1 origin $u.commit
          if ($LASTEXITCODE) { throw 'fetch failed' }
          git -C upstream checkout --detach FETCH_HEAD
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('upstream.json') }}

      - name: Apply the brand (icons, names, update and crash-report switches)
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/make_icon.py
          python tools/brand.py upstream
          if ($LASTEXITCODE) { throw 'branding failed' }

      - name: Compile (pjproject, vcpkg libraries, app)
        shell: pwsh
        run: ./upstream/build-custom.ps1 -BuildRoot $env:BUILD_ROOT

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package installer, portable zip and source zip
        shell: pwsh
        run: |
          python tools/package.py upstream --build-root $env:BUILD_ROOT --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($LASTEXITCODE) { throw 'packaging failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: phone-app
          if-no-files-found: error
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-app
          path: dist
      - name: Publish the program together with its source (GPL)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
